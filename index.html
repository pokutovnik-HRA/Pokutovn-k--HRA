<style>
/* VOICE: šatnový pokutový sešit – přímý, sportovní, bez ozdob
   IDEA: tabule v šatně / zápis rozhodčího – mřížka hráčů a prohřešků
   PICTURE: samotná tabulka pokut je obraz, nahoře pod titulkem
   COLOUR and TYPE: bílá hrací plocha, inkoust, červená trestná lavice; Barlow Condensed + Source Sans 3
   LAYOUT: červený pás s titulkem a součty, pod ním záložky a pracovní plocha přes celou šířku */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1216);--ink:light-dark(#14181f,#eef1f5);--mut:light-dark(#5b6472,#9aa4b2);
--line:light-dark(#e2e6ec,#262c35);--soft:light-dark(#f4f6f9,#171b21);--red:#e3262f;--redink:light-dark(#b8121b,#ff6b72);--chip:light-dark(#fde8e9,#3a1518)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.band{padding:clamp(20px,3vw,40px) max(4vw,14px)}
.top{background:var(--red);color:#fff;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0;font-size:clamp(40px,7vw,56px);line-height:1;font-weight:800;letter-spacing:.5px}
.top p{margin:4px 0 0;opacity:.9;font-size:15px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:800 clamp(28px,5vw,40px)/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.stat span{font-size:14px;opacity:.9}
nav{display:flex;gap:4px;padding:0 max(4vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:700 19px "Barlow Condensed",sans-serif;padding:12px 14px;min-height:48px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
.note{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--soft);color:var(--mut);font-size:15px}
.note:empty{display:none}
.quick{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.quick h2{grid-column:1/-1;margin:0;font-size:22px}
label{display:block;font-size:14px;color:var(--mut);font-weight:600}
select,input{width:100%;font:16px "Source Sans 3",sans-serif;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:4px}
button.btn{min-height:44px;padding:8px 18px;border-radius:8px;border:0;background:var(--red);color:#fff;font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.danger{background:none;color:var(--redink);border:1px solid var(--redink)}
.warn{background:var(--chip);color:var(--redink);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:15px}
button.link{background:none;border:0;color:var(--redink);font:600 15px "Source Sans 3",sans-serif;cursor:pointer;padding:6px;min-height:36px}
:focus-visible{outline:3px solid #2f7cf6;outline-offset:2px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:75vh}
table{border-collapse:separate;border-spacing:0;font-size:15px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top}
thead th{position:sticky;top:0;background:var(--soft);z-index:2;width:118px;min-width:118px;padding:8px;text-align:left;font-weight:600;font-size:13px;line-height:1.25;color:var(--ink)}
thead th .amt{display:block;margin-top:6px;font:700 16px "Barlow Condensed",sans-serif;color:var(--redink);white-space:nowrap}
.pc{position:sticky;left:0;background:var(--bg);z-index:1;min-width:190px;white-space:nowrap}
thead .pc{z-index:3;background:var(--soft)}
.pc button{all:unset;display:block;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.pc button:focus-visible{outline:3px solid #2f7cf6}
td.cell button{all:unset;box-sizing:border-box;display:block;width:100%;min-height:52px;padding:6px 8px;cursor:pointer}
td.cell button:hover{background:var(--soft)}
td.cell button:focus-visible{outline:3px solid #2f7cf6;outline-offset:-3px}
.cnt{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font:700 14px/20px "Barlow Condensed",sans-serif}
.dts{display:block;font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:3px}
.sum{text-align:right;padding:10px 12px;white-space:nowrap;font:700 18px "Barlow Condensed",sans-serif;min-width:96px}
.sum.wk{color:var(--redink)}
tfoot td{background:var(--soft);padding:8px;font:700 16px "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap}
tfoot .pc{background:var(--soft);padding:10px 12px;text-align:left}
.empty{padding:28px 16px;color:var(--mut);text-align:center}
.addp{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:16px}
.addp label{flex:1 1 220px}
.hidden-list{margin-top:10px;color:var(--mut);font-size:15px}
.week{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;background:var(--soft);flex-wrap:wrap}
.week h3{margin:0;font-size:22px}
.week header b{font:800 26px "Barlow Condensed",sans-serif;color:var(--redink);white-space:nowrap}
.week .cur{font-size:14px;color:#fff;background:var(--red);border-radius:6px;padding:1px 8px;margin-left:8px;font-family:"Source Sans 3",sans-serif;font-weight:600;vertical-align:middle}
.wrow{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto 48px;align-items:center;gap:4px 16px;padding:10px 16px;border-top:1px solid var(--line)}
.wrow .n{font-weight:700}.wrow .d{color:var(--mut);font-size:15px}.wrow .s{font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.pay{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--mut);display:grid;place-items:center;cursor:pointer;padding:0}
.pay svg{width:22px;height:22px}
.pay[aria-pressed=true]{background:#1f9d55;border-color:#1f9d55;color:#fff}
.pay.part{background:#f2a516;border-color:#f2a516;color:#fff}
.pay:disabled{cursor:default;opacity:.7}
.wrow.paid .s{color:#1f9d55}.wrow .lack{display:block;font:600 13px "Source Sans 3",sans-serif;color:#b36b00}
.wsum{font-size:14px;color:var(--mut);font-family:"Source Sans 3",sans-serif;display:block;text-align:right}
.t-pay{background:light-dark(#e3f6eb,#10301e);color:light-dark(#157a40,#6fdc9c)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.log time{color:var(--mut);font-size:14px;white-space:nowrap}
.log .who{font-weight:700}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px;white-space:nowrap}
.t-add{background:var(--chip);color:var(--redink)}.t-del{background:var(--soft);color:var(--mut);border:1px solid var(--line)}.t-pl{background:light-dark(#e7f0ff,#132440);color:light-dark(#1d4fb3,#8bb4ff)}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.md{background:var(--bg);color:var(--ink);border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.md h3{margin:0;font-size:26px;line-height:1.1}
.md .sub{color:var(--mut);margin:4px 0 14px}
.md ul{list-style:none;padding:0;margin:0 0 14px}
.md li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row label{flex:1 1 180px}
.md .foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;gap:14px;align-items:center;z-index:30;width:min(440px,calc(100% - 24px));justify-content:space-between}
.toast.on{display:flex}.toast button{background:none;border:0;color:#ff8a90;font-weight:700;font-size:15px;cursor:pointer;min-height:36px}
[hidden]{display:none!important}
@media(max-width:700px){.quick{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.quick .q-o{grid-column:1/-1;order:-1}.quick h2{order:-2}.quick button{grid-column:1/-1}
.wrow{grid-template-columns:minmax(0,1fr) auto 48px}.wrow .d{grid-column:1/-1;grid-row:2}.log li{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.toast.on{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
</style>
</head>
<body>
<header class="band top">
  <div><h1>Pokutovník</h1><p id="status">Načítám data…</p><p id="me" style="font-size:14px"></p></div>
  <div class="stats">
    <div class="stat"><b id="sWeek">0 Kč</b><span>tento týden</span></div>
    <div class="stat"><b id="sAll">0 Kč</b><span>celkem</span></div>
    <div class="stat"><b id="sCnt">0</b><span>pokut celkem</span></div>
  </div>
</header>
<nav role="tablist">
  <button role="tab" data-t="table" aria-selected="true">Tabulka</button>
  <button role="tab" data-t="weeks" aria-selected="false">Týdenní součty</button>
  <button role="tab" data-t="log" aria-selected="false">Historie změn</button>
</nav>
<main class="band">
  <p class="note" id="note"></p>
  <section id="v-table">
    <form class="quick" id="quick">
      <h2>Rychlý zápis pokuty</h2>
      <label>Hráč<select id="qP"></select></label>
      <label class="q-o">Prohřešek<select id="qO"></select></label>
      <label>Datum<input type="date" id="qD"></label>
      <button class="btn" type="submit">Zapsat pokutu</button>
    </form>
    <div class="wrap"><table id="grid"></table></div>
    <form class="addp" id="addp">
      <label>Nový hráč<input id="newP" placeholder="Jméno a příjmení" autocomplete="off" maxlength="60"></label>
      <button class="btn" type="submit">Přidat hráče</button>
    </form>
    <div class="hidden-list" id="hiddenP"></div>
  </section>
  <section id="v-weeks" hidden></section>
  <section id="v-log" hidden><ul class="log" id="logList"></ul></section>
</main>
<div class="ov" id="gate"><form class="md" id="gateF">
  <h3>Vstup do pokutovníku</h3>
  <p class="sub">Zadej kód týmu, který ti poslal správce, a své jméno. Jméno se ukáže v historii změn. </p>
  <label>Kód týmu<input id="gCode" autocomplete="off" placeholder="aspoň 10 znaků, např. hranice-pokuty-7731" minlength="10" maxlength="60" required></label>
  <label style="margin-top:10px">Tvoje jméno<input id="gName" autocomplete="name" maxlength="40" required></label>
  <p class="sub" id="gErr" style="color:var(--redink);margin:10px 0 0"></p>
  <div class="foot"><span></span><button class="btn" type="submit">Vstoupit</button></div>
</form></div>
<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true" id="md"></div></div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastU">Zpět</button></div>
<script>
{
const OFF=[
 ["o1","Odhlášení z tréninku bez omluvy méně než 3 hodiny předem",30],
 ["o2","Pozdní příchod bez omluvy",20],
 ["o3","Pozdní příjezd na sraz",30],
 ["o4","Nepozornost u tabule",10],
 ["o5","Předčasný odchod do šatny",20],
 ["o6","Telefon při zápase",50],
 ["o7","Nevhodné chování ke spoluhráči",50],
 ["o8","Neuklízení mantinelu/míčků → odchod do šatny",30],
 ["o9","Zapomenuté rozcvičovací triko",30],
 ["o10","Zapomenutý dres / část dresu",30],
 ["o11","2 za kecy",50],
 ["o12","Zapomenutý reprak / žezlo / rozlišky",30]
].map(([id,name,amt])=>({id,name,amt}));
const OM=Object.fromEntries(OFF.map(o=>[o.id,o]));
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kc=n=>Number(n||0).toLocaleString("cs-CZ")+" Kč";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const pd=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const monday=s=>{const d=pd(s);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return iso(d)};
const weekNo=s=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7));const y=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-y)/864e5-3+((y.getUTCDay()+6)%7))/7)};
const fd=s=>{const d=pd(s);return d.getUTCDate()+". "+(d.getUTCMonth()+1)+"."};
const fdy=s=>fd(s)+" "+pd(s).getUTCFullYear();
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s));

let db=null,base=null,me="",canWrite=true,players=[],fines=[],logs=[],pays={},names={},tab="table",loaded={p:0,f:0};
const curMon=()=>monday(today());

function activePlayers(){return players.filter(p=>!p.archived).sort((a,b)=>String(a.name).localeCompare(String(b.name),"cs"))}
function pName(id){const p=players.find(x=>x.id===id);return p?String(p.name||"?"):"(smazaný hráč)"}
function validFines(){return fines.filter(f=>OM[f.off]&&okDate(f.date))}

function render(){
  const vf=validFines(),cm=curMon();
  const wk=vf.filter(f=>monday(f.date)===cm);
  $("#sWeek").textContent=kc(wk.reduce((a,f)=>a+(+f.amount||0),0));
  $("#sAll").textContent=kc(vf.reduce((a,f)=>a+(+f.amount||0),0));
  $("#sCnt").textContent=vf.length;
  renderGrid(vf,cm);renderQuick();renderHidden();
  if(tab==="weeks")renderWeeks(vf,cm);
  if(tab==="log")renderLog();
  for(const el of document.querySelectorAll("#quick select,#quick input,#quick button,#addp input,#addp button"))el.disabled=!canWrite||!db;
}
function renderGrid(vf,cm){
  const ap=activePlayers();
  const by={};for(const f of vf){(by[f.player+"|"+f.off]??=[]).push(f)}
  let h='<thead><tr><th class="pc">Hráč</th>'+OFF.map(o=>`<th>${esc(o.name)}<span class="amt">${kc(o.amt)}</span></th>`).join("")+'<th class="sum">Tento týden</th><th class="sum">Celkem</th></tr></thead><tbody>';
  if(!ap.length)h+=`<tr><td class="empty" colspan="${OFF.length+3}">Zatím tu nejsou žádní hráči. Přidej je pod tabulkou.</td></tr>`;
  for(const p of ap){
    let tot=0,wt=0;
    h+=`<tr><th class="pc"><button data-pl="${esc(p.id)}" title="Upravit hráče">${esc(p.name)}</button></th>`;
    for(const o of OFF){
      const list=(by[p.id+"|"+o.id]||[]).sort((a,b)=>a.date<b.date?-1:1);
      for(const f of list){tot+=+f.amount||0;if(monday(f.date)===cm)wt+=+f.amount||0}
      const shown=list.slice(-4).map(f=>fd(f.date)).join(", ")+(list.length>4?" …":"");
      h+=`<td class="cell"><button data-c="${esc(p.id)}|${o.id}" aria-label="${esc(p.name)} – ${esc(o.name)}">${list.length?`<span class="cnt">${list.length}×</span><span class="dts">${shown}</span>`:""}</button></td>`;
    }
    h+=`<td class="sum wk">${wt?kc(wt):"–"}</td><td class="sum">${kc(tot)}</td></tr>`;
  }
  h+="</tbody>";
  if(ap.length){
    const ids=new Set(ap.map(p=>p.id));const af=vf.filter(f=>ids.has(f.player));
    h+='<tfoot><tr><td class="pc">Součet</td>'+OFF.map(o=>{const s=af.filter(f=>f.off===o.id).reduce((a,f)=>a+(+f.amount||0),0);return`<td>${s?kc(s):"–"}</td>`}).join("")+
      `<td>${kc(af.filter(f=>monday(f.date)===cm).reduce((a,f)=>a+(+f.amount||0),0))}</td><td>${kc(af.reduce((a,f)=>a+(+f.amount||0),0))}</td></tr></tfoot>`;
  }
  $("#grid").innerHTML=h;
}
function renderQuick(){
  const qp=$("#qP"),cur=qp.value;
  qp.innerHTML='<option value="">— vyber hráče —</option>'+activePlayers().map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  qp.value=cur;
  if(!$("#qO").options.length)$("#qO").innerHTML=OFF.map(o=>`<option value="${o.id}">${esc(o.name)} (${kc(o.amt)})</option>`).join("");
  if(!$("#qD").value)$("#qD").value=today();
}
function renderHidden(){
  const hp=players.filter(p=>p.archived);
  $("#hiddenP").innerHTML=hp.length?"Skrytí hráči: "+hp.map(p=>`${esc(p.name)} <button class="link" data-restore="${esc(p.id)}">vrátit</button>`).join(" · "):"";
}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const payKey=(k,pid)=>k+"_"+pid;
function renderWeeks(vf,cm){
  const g={};for(const f of vf)(g[monday(f.date)]??=[]).push(f);
  if(!g[cm])g[cm]=[];
  const keys=Object.keys(g).sort().reverse();
  $("#v-weeks").innerHTML=keys.map(k=>{
    const list=g[k],end=pd(k);end.setUTCDate(end.getUTCDate()+6);
    const tot=list.reduce((a,f)=>a+(+f.amount||0),0);
    const pp={};for(const f of list)(pp[f.player]??=[]).push(f);
    let paidSum=0;
    const rows=Object.entries(pp).map(([pid,l])=>{
      const c={};for(const f of l)c[f.off]=(c[f.off]||0)+1;
      const sum=l.reduce((a,f)=>a+(+f.amount||0),0),py=pays[payKey(k,pid)],paid=!!(py&&py.paid),pa=paid?Math.min(+py.amount||0,sum):0;
      paidSum+=pa;
      return{pid,n:pName(pid),s:sum,paid,lack:paid&&pa<sum?sum-pa:0,d:Object.entries(c).map(([o,n])=>OM[o].name+(n>1?" "+n+"×":"")).join(", ")}
    }).sort((a,b)=>b.s-a.s);
    return`<article class="week"><header><h3>Týden ${weekNo(k)} · ${fd(k)} – ${fdy(iso(end))}${k===cm?'<span class="cur">aktuální</span>':""}</h3><div><b>${kc(tot)}</b>${tot?`<span class="wsum">${paidSum>=tot?"vše zaplaceno":"zaplaceno "+kc(paidSum)+" · zbývá "+kc(tot-paidSum)}</span>`:""}</div></header>`+
      (rows.length?rows.map(r=>`<div class="wrow${r.paid&&!r.lack?" paid":""}"><span class="n">${esc(r.n)}</span><span class="d">${esc(r.d)}</span><span class="s">${kc(r.s)}${r.lack?`<span class="lack">doplatit ${kc(r.lack)}</span>`:""}</span>`+
        `<button class="pay${r.lack?" part":""}" data-pay="${k}|${esc(r.pid)}" aria-pressed="${r.paid}" title="${r.paid?"Zaplaceno – klikni pro zrušení":"Označit jako zaplaceno"}" aria-label="${esc(r.n)}: ${r.paid?"zaplaceno":"nezaplaceno"}" ${canWrite&&db?"":"disabled"}>${CHECK}</button></div>`).join(""):'<div class="wrow"><span class="d">Tento týden zatím bez pokut.</span></div>')+"</article>";
  }).join("");
}
async function togglePay(k,pid){
  const id=payKey(k,pid),py=pays[id],sum=validFines().filter(f=>f.player===pid&&monday(f.date)===k).reduce((a,f)=>a+(+f.amount||0),0);
  const wasPaid=!!(py&&py.paid),lack=wasPaid&&(+py.amount||0)<sum;
  const nowPaid=lack?true:!wasPaid;
  try{await col("platby").doc(id).set({week:k,player:pid,paid:nowPaid,amount:nowPaid?sum:0,who:me,at:new Date().toISOString()})}catch(e){return fail(e)}
  await addLog({type:nowPaid?"pay":"unpay",player:pid,pname:pName(pid),date:k,amount:sum});
}
$("#v-weeks").addEventListener("click",e=>{const b=e.target.closest("[data-pay]");if(!b||b.disabled)return;const[k,pid]=b.dataset.pay.split("|");togglePay(k,pid)});
function logText(l){
  const o=OM[l.off],on=o?o.name:"";
  switch(l.type){
    case"add":return[`<span class="tag t-add">pokuta</span>`,`${esc(l.pname)} – ${esc(on)} (${kc(l.amount)}), ${okDate(l.date)?fdy(l.date):""}`];
    case"del":return[`<span class="tag t-del">smazáno</span>`,`${esc(l.pname)} – ${esc(on)} (${kc(l.amount)}), ${okDate(l.date)?fdy(l.date):""}`];
    case"padd":return[`<span class="tag t-pl">hráč</span>`,`Přidán hráč ${esc(l.pname)}`];
    case"pren":return[`<span class="tag t-pl">hráč</span>`,`Přejmenován ${esc(l.old)} → ${esc(l.pname)}`];
    case"phide":return[`<span class="tag t-pl">hráč</span>`,`Skryt hráč ${esc(l.pname)}`];
    case"pay":return[`<span class="tag t-pay">zaplaceno</span>`,`${esc(l.pname)} – týden ${okDate(l.date)?weekNo(l.date)+" ("+fd(l.date)+")":""}, ${kc(l.amount)}`];
    case"unpay":return[`<span class="tag t-del">zrušeno zaplacení</span>`,`${esc(l.pname)} – týden ${okDate(l.date)?weekNo(l.date)+" ("+fd(l.date)+")":""}`];
    case"roster":return[`<span class="tag t-pl">hráči</span>`,`Hromadně přidáno ${esc(l.pname)} hráčů`];
    case"pdel":return[`<span class="tag t-del">smazán hráč</span>`,`${esc(l.pname)} (pokut: ${esc(l.date)}, ${kc(l.amount)})`];
    case"pshow":return[`<span class="tag t-pl">hráč</span>`,`Vrácen hráč ${esc(l.pname)}`];
    default:return["",""];
  }
}
function renderLog(){
  $("#logList").innerHTML=logs.length?logs.map(l=>{const[t,x]=logText(l);const d=new Date(l.at);
    return`<li><time>${isNaN(d)?"":d.toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}</time><div><span class="who">${esc(l.who||"Někdo")}</span> · ${t}${x}</div></li>`}).join(""):'<li class="empty" style="display:block">Zatím žádné změny.</li>';
}
/* zápisy */
async function addLog(o){try{await col("historie").add({...o,who:me,at:new Date().toISOString()})}catch(e){}}
function fail(e){
  const c=e&&e.code||"";
  if(c==="permission-denied")toast("Databáze zápis odmítla – zkontroluj pravidla ve Firebase a kód týmu.");
  else if(c==="resource-exhausted")toast("Denní limit databáze je vyčerpaný, zkus to zítra.");
  else toast("Změnu se nepodařilo uložit, zkontroluj připojení.");
}
async function addFine(pid,oid,date){
  const o=OM[oid];if(!db||!o||!okDate(date)||!pid)return;
  const ref=col("pokuty").doc();
  try{await ref.set({player:pid,off:oid,date,amount:o.amt,who:me,at:new Date().toISOString()})}catch(e){return fail(e)}
  await addLog({type:"add",player:pid,pname:pName(pid),off:oid,date,amount:o.amt});
  toast(`${pName(pid)}: ${o.name} (${kc(o.amt)})`,()=>delFine(ref.id));
}
async function delFine(id){
  const f=fines.find(x=>x.id===id);if(!f)return;
  try{await col("pokuty").doc(id).delete()}catch(e){return fail(e)}
  await addLog({type:"del",player:f.player,pname:pName(f.player),off:f.off,date:f.date,amount:f.amount});
}
async function addPlayer(name){
  try{await col("hraci").add({name,archived:false,who:me,at:new Date().toISOString()})}catch(e){return fail(e)}
  await addLog({type:"padd",pname:name});
}
async function delPlayer(id){
  const p=players.find(x=>x.id===id);if(!p)return closeMd();
  const pf=fines.filter(f=>f.player===id),sum=pf.reduce((a,f)=>a+(+f.amount||0),0);
  try{
    for(const f of pf)await col("pokuty").doc(f.id).delete();
    for(const k of Object.keys(pays))if(pays[k]&&pays[k].player===id)await col("platby").doc(k).delete();
    await col("hraci").doc(id).delete();
  }catch(e){if(mdState)mdState.busy=false;drawMd();return fail(e)}
  closeMd();
  await addLog({type:"pdel",pname:p.name,amount:sum,date:String(pf.length)});
  toast(`Hráč ${p.name} byl smazán.`);
}
async function updPlayer(id,patch,logObj){
  try{await col("hraci").doc(id).update(patch)}catch(e){return fail(e)}
  await addLog(logObj);
}

/* dialogy */
let mdState=null;
function openCell(pid,oid){mdState={k:"c",pid,oid};drawMd();$("#ov").classList.add("on");setTimeout(()=>$("#md input,#md button")?.focus(),30)}
function openPlayer(pid){mdState={k:"p",pid};drawMd();$("#ov").classList.add("on");setTimeout(()=>$("#md input")?.focus(),30)}
function closeMd(){mdState=null;$("#ov").classList.remove("on")}
function drawMd(){
  if(!mdState)return;const md=$("#md");
  if(mdState.k==="c"){
    const o=OM[mdState.oid],list=validFines().filter(f=>f.player===mdState.pid&&f.off===mdState.oid).sort((a,b)=>a.date<b.date?1:-1);
    md.innerHTML=`<h3>${esc(pName(mdState.pid))}</h3><p class="sub">${esc(o.name)} · ${kc(o.amt)} za každý zápis</p>`+
     (list.length?`<ul>${list.map(f=>`<li><span>${fdy(f.date)} · ${kc(f.amount)}</span>${canWrite?`<button class="link" data-del="${esc(f.id)}">Smazat</button>`:""}</li>`).join("")}</ul>`:'<p class="sub">Zatím žádná pokuta.</p>')+
     (canWrite?`<form class="row" id="mdF"><label>Datum<input type="date" id="mdD" value="${today()}"></label><button class="btn" type="submit">Přidat pokutu</button></form>`:"")+
     `<div class="foot"><span class="sub" style="margin:0">Celkem ${kc(list.reduce((a,f)=>a+(+f.amount||0),0))}</span><button class="btn ghost" data-close>Zavřít</button></div>`;
  }else{
    const p=players.find(x=>x.id===mdState.pid);if(!p)return closeMd();
    const pf=fines.filter(f=>f.player===p.id),psum=pf.reduce((a,f)=>a+(+f.amount||0),0);
    md.innerHTML=`<h3>Upravit hráče</h3><p class="sub">Skrytý hráč zmizí z tabulky, jeho pokuty zůstanou v týdenních součtech. Smazání odstraní hráče i všechny jeho pokuty.</p>`+
     `<form class="row" id="mdR"><label>Jméno<input id="mdN" value="${esc(p.name)}" maxlength="60" ${canWrite?"":"disabled"}></label>${canWrite?'<button class="btn" type="submit">Uložit</button>':""}</form>`+
     (mdState.confirm?`<p class="warn">Opravdu smazat hráče <b>${esc(p.name)}</b>? Smaže se i ${pf.length} ${pf.length===1?"pokuta":pf.length>=2&&pf.length<=4?"pokuty":"pokut"} (${kc(psum)}) a jeho platby. Tohle nejde vrátit.</p>`+
       `<div class="foot"><button class="btn ghost" data-noconf>Zpět</button><button class="btn" data-delp>${mdState.busy?"Mažu…":"Ano, smazat"}</button></div>`
     :`<div class="foot">${canWrite?'<button class="btn ghost" data-hide>Skrýt z tabulky</button><button class="btn danger" data-askdel>Smazat hráče</button>':""}<button class="btn ghost" data-close>Zavřít</button></div>`);
  }
}
$("#ov").addEventListener("click",e=>{
  if(e.target.id==="ov"||e.target.closest("[data-close]"))return closeMd();
  const d=e.target.closest("[data-del]");if(d)return delFine(d.dataset.del);
  if(e.target.closest("[data-askdel]")){mdState.confirm=true;return drawMd()}
  if(e.target.closest("[data-noconf]")){mdState.confirm=false;return drawMd()}
  if(e.target.closest("[data-delp]")){if(!mdState.busy){mdState.busy=true;drawMd();delPlayer(mdState.pid)}return}
  if(e.target.closest("[data-hide]")){const p=players.find(x=>x.id===mdState.pid);closeMd();if(p)updPlayer(p.id,{archived:true},{type:"phide",pname:p.name})}
});
$("#ov").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="mdF"){const d=$("#mdD").value;if(okDate(d))addFine(mdState.pid,mdState.oid,d)}
  if(e.target.id==="mdR"){const n=$("#mdN").value.trim(),p=players.find(x=>x.id===mdState.pid);if(n&&p&&n!==p.name)updPlayer(p.id,{name:n},{type:"pren",old:p.name,pname:n});closeMd()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMd()});

/* toast */
let tT=null,tUndo=null;
function toast(t,undo){$("#toastT").textContent=t;tUndo=undo||null;$("#toastU").hidden=!undo;$("#toast").classList.add("on");clearTimeout(tT);tT=setTimeout(()=>$("#toast").classList.remove("on"),6000)}
$("#toastU").addEventListener("click",()=>{const u=tUndo;tUndo=null;$("#toast").classList.remove("on");if(u)u()});

/* události */
$("#grid").addEventListener("click",e=>{
  const c=e.target.closest("[data-c]");if(c){const[p,o]=c.dataset.c.split("|");return openCell(p,o)}
  const p=e.target.closest("[data-pl]");if(p)openPlayer(p.dataset.pl);
});
$("#hiddenP").addEventListener("click",e=>{const b=e.target.closest("[data-restore]");if(!b||!canWrite)return;const p=players.find(x=>x.id===b.dataset.restore);if(p)updPlayer(p.id,{archived:false},{type:"pshow",pname:p.name})});
$("#quick").addEventListener("submit",e=>{e.preventDefault();const p=$("#qP").value,o=$("#qO").value,d=$("#qD").value;if(!p){$("#qP").focus();return toast("Vyber hráče.")}if(!okDate(d))return toast("Zadej datum.");addFine(p,o,d)});
$("#addp").addEventListener("submit",e=>{e.preventDefault();const n=$("#newP").value.trim();if(!n)return;if(activePlayers().some(p=>String(p.name).toLowerCase()===n.toLowerCase()))return toast("Tento hráč už v tabulce je.");$("#newP").value="";addPlayer(n)});
for(const b of document.querySelectorAll("nav button"))b.addEventListener("click",()=>{
  tab=b.dataset.t;for(const x of document.querySelectorAll("nav button"))x.setAttribute("aria-selected",x===b);
  for(const v of["table","weeks","log"])$("#v-"+v).hidden=v!==tab;render();
});

/* start */
const col=n=>base.collection(n);
const LS={get(k){try{return localStorage.getItem(k)||""}catch(e){return""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const okCode=c=>/^[A-Za-z0-9_-]{10,60}$/.test(c);
let unsub=[];
function connect(code){
  for(const u of unsub)u();unsub=[];players=[];fines=[];logs=[];pays={};loaded={p:0,f:0};
  base=db.collection("tymy").doc(code);
  $("#me").innerHTML=`Zapisuješ jako <b>${esc(me)}</b> · <button class="link" id="chg" style="color:#fff;text-decoration:underline">změnit</button>`;
  $("#status").textContent="Načítám data…";
  const timer=setTimeout(()=>{if(!(loaded.p&&loaded.f))$("#status").textContent="Data se zatím nedaří načíst – zkontroluj připojení."},10000);
  const done=()=>{if(loaded.p&&loaded.f){clearTimeout(timer);$("#status").textContent="Synchronizováno · změny vidí všichni hned"}};
  const err=e=>{clearTimeout(timer);
    if(e&&e.code==="permission-denied"){for(const u of unsub)u();unsub=[];players=[];fines=[];logs=[];pays={};LS.set("pk_code","");$("#status").textContent="Neplatný kód týmu.";render();showGate();$("#gErr").textContent="Neplatný kód týmu – zkontroluj ho a zkus to znovu.";return}
    $("#status").textContent="Spojení s daty se přerušilo – obnov stránku."};
  unsub.push(col("hraci").onSnapshot({includeMetadataChanges:true},s=>{players=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>typeof p.name==="string");if(!s.metadata.fromCache)loaded.p=1;done();render();drawMd()},err));
  unsub.push(col("pokuty").onSnapshot({includeMetadataChanges:true},s=>{fines=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.f=1;done();render();drawMd()},err));
  unsub.push(col("platby").onSnapshot(s=>{const m={};for(const d of s.docs)m[d.id]=d.data();pays=m;if(tab==="weeks")render()},()=>{}));
  unsub.push(col("historie").orderBy("at","desc").limit(300).onSnapshot(s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="log")renderLog()},()=>{}));
  render();
}
function showGate(){$("#gCode").value=LS.get("pk_code");$("#gName").value=LS.get("pk_name");$("#gErr").textContent="";$("#gate").classList.add("on");setTimeout(()=>$("#gCode").focus(),30)}
$("#gateF").addEventListener("submit",e=>{
  e.preventDefault();const c=$("#gCode").value.trim(),n=$("#gName").value.trim();
  if(!okCode(c))return $("#gErr").textContent="Kód musí mít 10–60 znaků a obsahovat jen písmena bez diakritiky, číslice, - nebo _.";
  if(!n)return $("#gErr").textContent="Zadej své jméno.";
  LS.set("pk_code",c);LS.set("pk_name",n);me=n;$("#gate").classList.remove("on");connect(c);
});
document.addEventListener("click",e=>{if(e.target.id==="chg")showGate()});
render();
if(!window.firebase||!FIREBASE_CONFIG.projectId){
  canWrite=false;$("#status").textContent="Chybí připojení k databázi.";
  $("#note").textContent=window.firebase?"Do souboru index.html je potřeba vložit konfiguraci z Firebase (hned na začátku souboru).":"Nepodařilo se načíst knihovnu Firebase – zkontroluj připojení k internetu.";
  render();
}else{
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  const c=LS.get("pk_code"),n=LS.get("pk_name");
  if(okCode(c)&&n){me=n;connect(c)}else showGate();
}
}
</script>
</body>
</html>
